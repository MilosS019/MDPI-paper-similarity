name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI runs exactly
      # the dependency set that is committed. Python comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests

      # Unit and integration tests. The integration tests start Postgres and Qdrant with
      # testcontainers, using the Docker daemon the hosted runner already has. The embedding
      # model is replaced by a deterministic fake, so nothing is downloaded and arXiv is
      # never called.
      - name: Tests
        run: uv run pytest --cov=paper_similarity --cov-report=term-missing

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
