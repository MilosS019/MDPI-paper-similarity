name: paper-similarity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development credentials only; override via environment in real deployments.
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off job: apply migrations before the API starts (an init Job in Kubernetes).
  migrate:
    build: .
    image: paper-similarity:local
    command: ["migrate"]
    environment: &app-env
      PULSE_DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      PULSE_QDRANT_URL: http://qdrant:6333
      PULSE_LOG_LEVEL: ${PULSE_LOG_LEVEL:-INFO}
      PULSE_LOG_FORMAT: ${PULSE_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: paper-similarity:local
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - raw-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  raw-data:
