[project]
name = "paper-similarity"
version = "0.1.0"
description = "Scientific paper similarity service: arXiv ingestion, embeddings and vector search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anyio>=4.6",
    "asyncpg>=0.30",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "feedparser>=6.0",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.13",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
pulse = "paper_similarity.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "testcontainers[postgres,qdrant]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_similarity"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID",
]
ignore = ["S101"]  # asserts are fine in tests; mypy narrows with them elsewhere

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["feedparser.*", "testcontainers.*", "pyarrow.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (testcontainers for Postgres and Qdrant)",
    "model: downloads and runs the real embedding model (slow, opt-in)",
]
addopts = "-ra --strict-markers -m 'not model'"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]
